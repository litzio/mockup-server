services:
  jira:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:${JIRA_PORT:-8081}:8080"
    volumes:
      - ./services/jira:/home/wiremock:ro
    command: ["--local-response-templating"]
  confluence:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:${CONFLUENCE_PORT:-8082}:8080"
    volumes:
      - ./services/confluence:/home/wiremock:ro
    command: ["--local-response-templating"]
