name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run issues:forms -- --check
      - run: npm test
      - name: Check commit provenance
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: node scripts/commit-provenance.mjs event "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"
      - name: Start mock services
        run: docker compose -p mockup-ci up -d
      - run: npm run wait:services
      - run: npm run test:services
      - name: Supplied acceptance matrix, default context
        env:
          JIRA_BASE_URL: http://127.0.0.1:8081
          CONFLUENCE_BASE_URL: http://127.0.0.1:8082
        run: node scripts/acceptance/run.mjs --owned --server-only --mode default --output "$RUNNER_TEMP/acceptance-default.json"
      - name: Custom context, links and supplied acceptance matrix
        env:
          JIRA_CONTEXT: /custom-context
          CONFLUENCE_CONTEXT: /custom-context
          JIRA_BASE_URL: http://localhost:8081/custom-context
          CONFLUENCE_BASE_URL: http://localhost:8082/custom-context
        run: |
          node scripts/prepare-context.mjs
          docker compose -f compose.yaml -f compose.context.yaml -p mockup-ci up -d --force-recreate
          npm run wait:services
          node scripts/check-context.mjs
          node --test --test-concurrency=1 services/jira/tests/error-scenarios.test.mjs services/jira/tests/current-user-search.test.mjs services/confluence/tests/personal-space.test.mjs
          node scripts/acceptance/run.mjs --owned --server-only --mode context --output "$RUNNER_TEMP/acceptance-context.json"
      - name: Service logs
        if: failure()
        run: docker compose -p mockup-ci logs
      - name: Stop mock services
        if: always()
        run: docker compose -p mockup-ci down
