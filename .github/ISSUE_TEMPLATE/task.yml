# Generated by npm run issues:forms; edit scripts/issue-policy.mjs.
name: 개발 작업
description: 범위가 정해진 유지보수·문서·개발 작업을 기록합니다.
labels:
  - type:task
body:
  - type: markdown
    attributes:
      value: '제목은 `영역: 구체적인 증상 또는 원하는 결과`로 작성합니다. 예: `Jira: 존재하지 않는 이슈 조회의 오류 응답이 누락됨`. 영역을 모르면 Product를 선택합니다. 원인·구현안·테스트 계획을 추정해 채우지 않습니다. [작성 규칙](https://github.com/litzio/mockup-server/blob/main/docs/contributing/issues.md)'
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Jira
        - Confluence
        - Server
        - Docs
        - Product
      default: 4
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 작업이 필요한 이유와 확인한 현재 상태를 적습니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 목표와 범위
      description: 이번 작업의 목표와 범위를 적습니다.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 완료 기준
      description: 작업 완료를 판단할 구체적인 결과를 적습니다. 목표를 그대로 반복하거나 미래 테스트 계획을 자동으로 추가하지 않습니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거 / 관련 자료
      description: 사용자 보고와 직접 확인한 결과를 구분하고, 확인한 코드·문서·화면·관련 이슈를 연결합니다.
    validations:
      required: false
